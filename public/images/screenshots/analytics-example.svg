<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1e293b"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" fill="#0f172a" rx="8"/>
  <text x="400" y="55" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="20" font-weight="bold">Analytics & Reports</text>
  
  <!-- Charts Area -->
  <rect x="20" y="100" width="370" height="220" fill="#0f172a" rx="8"/>
  <rect x="410" y="100" width="370" height="220" fill="#0f172a" rx="8"/>
  
  <!-- Chart 1 - Line Chart -->
  <polyline points="40,280 80,240 120,200 160,180 200,160 240,140 280,120 320,100 360,110" 
            stroke="#06b6d4" stroke-width="3" fill="none"/>
  
  <!-- Chart 2 - Bar Chart -->
  <rect x="430" y="200" width="30" height="80" fill="#10b981"/>
  <rect x="470" y="180" width="30" height="100" fill="#10b981"/>
  <rect x="510" y="160" width="30" height="120" fill="#10b981"/>
  <rect x="550" y="140" width="30" height="140" fill="#10b981"/>
  <rect x="590" y="190" width="30" height="90" fill="#10b981"/>
  
  <!-- Tables -->
  <rect x="20" y="340" width="760" height="240" fill="#0f172a" rx="8"/>
  <rect x="40" y="360" width="720" height="30" fill="#374151" rx="4"/>
  <rect x="40" y="400" width="720" height="25" fill="#1e293b" rx="2"/>
  <rect x="40" y="430" width="720" height="25" fill="#374151" rx="2"/>
  <rect x="40" y="460" width="720" height="25" fill="#1e293b" rx="2"/>
  <rect x="40" y="490" width="720" height="25" fill="#374151" rx="2"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#06b6d4" font-family="Arial" font-size="14">Analytics Dashboard</text>
  <text x="400" y="590" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="12">Data Visualization & Reporting Interface</text>
</svg>
